definitions:
  api.JobResult:
    properties:
      duration_ms:
        type: integer
      error:
        type: string
      final_report:
        type: string
      job_id:
        type: string
      ocr_text:
        type: string
      review_notes:
        items:
          type: string
        type: array
      status:
        description: processing | done | failed
        type: string
      structured:
        additionalProperties: {}
        type: object
      translation:
        type: string
    type: object
  api.apiError:
    properties:
      error:
        example: error message
        type: string
    type: object
info:
  contact: {}
paths:
  /api/health:
    get:
      description: 服务存活探测
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - system
  /api/jobs/{id}:
    get:
      description: 按 jobID 查询一次审读的结果（当前实现为同步接口，此端点预留异步扩展）
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 查询任务结果
      tags:
      - jobs
  /api/payslip/review:
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data 上传工资单图片（字段名 file），同步执行 OCR→翻译→审读→专家→汇总，返回完整报告
      parameters:
      - description: 工资单图片（PNG/JPG）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 上传工资单并执行审读流水线
      tags:
      - payslip
swagger: "2.0"
