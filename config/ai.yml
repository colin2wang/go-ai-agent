# ============================================================================
# AI provider 配置（由 config.yml 的 ai.config 引用）
# ----------------------------------------------------------------------------
# 本文件只描述「连哪个 AI 端点」与全局默认值，不描述具体业务流程。
# 业务流程（步骤 → provider + model + 提示词）属于子功能，见 config/features/*.yml。
#
# 支持多种后端（LM Studio / Ollama / OpenAI 兼容 API）：
#   - providers：嵌套列表声明连接端点，可被任意子功能的任意步骤复用
#   - 未填字段回退到本文件顶部的全局默认值
#   - 模型无全局默认，必须由子功能步骤显式指定 model（provider 在 ai.yml 中声明）
# ============================================================================
llm:
  # ---- 全局默认回退值（provider / 步骤未填时回退到这里）----
  base-url: http://localhost:1234/v1
  api-key: lm-studio
  temperature: 0.3
  timeout-seconds: 600
  connect-timeout-seconds: 10
  # 单次生成最大 token 数；思考型模型（qwen3）先输出大量推理过程，
  # 4096 易被推理耗尽导致返回空内容，故本地推理路径用 8192。
  max-tokens: 8192
  debug-request-log: false

  # LLM 调用输入/输出日志（io-log）：每次调用生成一个 request_id，输入与输出日志共用同一 ID 便于配对
  # （UUID 仅用于日志，不提交给 LLM）。文本统一折叠为单行（换行→空格），按前后各 head-chars/tail-chars
  # 截断并记录总字数；多轮对话仅详细输出 system 与最后两条消息，更早历史以 history_msgs 计数代替。
  # 多模态输入只记录媒体类型与字节数，不记录二进制内容。
  io-log:
    enabled: true
    head-chars: 1000
    tail-chars: 1000
    # 调试模式：额外输出完整提交文本（多模态仅文本部分与图片 data URL 长度）与模型原始
    # 输出（含 reasoning 与 token 用量），不截断不折叠；同时开启 HTTP 层抓包（wire dump，
    # 记录发给端点的原始请求体与端点原始响应，base64 只记长度）。用于排查空回答等问题。
    debug: true

  # 统一以流式接收模型返回消息（推理 REASONING + 回答 ANSWER 增量块经 LlmStreamOutput 累积），
  # 默认开启；关闭时回退一次返回的普通调用。
  stream-output: true

  # 是否开启推理（思考模式），默认开启。
  # 关闭时对所有请求强制 reasoning_effort=none，关闭 Qwen3 系列 / LM Studio 上的思考模式，
  # 可显著加快响应并避免思考过程吃光 max-tokens 预算。子功能各步骤可独立覆盖。
  reasoning-enabled: true

  # 默认使用的 provider 名（对应 providers[].name）；步骤未指定 provider 时回退此项。
  default-provider: lmstudio-local

  # ===== 多种 AI 后端连接端点 =====
  providers:
    # 1) LM Studio 本地推理（OpenAI 兼容）。base-url 必须带 /v1：
    #    langchaingo 仅做 baseURL + "/chat/completions" 的拼接，不会自动补 /v1，
    #    少写 /v1 会打到不存在的 /chat/completions，端点返回
    #    "Unexpected endpoint or method" 且 HTTP 200，表现为「空回答」。
    - name: lmstudio-local
      type: lmstudio
      base-url: http://localhost:1234/v1
      api-key: lm-studio
      timeout-seconds: 600
      connect-timeout-seconds: 10
      max-tokens: 8192

    # 2) Ollama 本地服务（0.1.27+ 提供 OpenAI 兼容 /v1 端点）
    - name: ollama-local
      type: ollama
      base-url: http://localhost:11434/v1
      api-key: ollama
      timeout-seconds: 600
      connect-timeout-seconds: 10
      max-tokens: 4096

    # 3) OpenAI 兼容云端 / 网关（硅基流动、OneAPI、vLLM、OpenAI 官方等）
    #    视觉模型（VLM，如 Qwen2.5-VL-7B-Instruct）同样复用以上端点，
    #    无需单独声明 provider，由子功能步骤的 provider + model 指定即可。
    - name: openai-cloud
      type: openai-compatible
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:sk-your-key-here}
      timeout-seconds: 120
      connect-timeout-seconds: 10
      max-tokens: 4096
