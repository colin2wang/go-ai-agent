# ============================================================================
# 子功能：扫描版图书目录 → 文字版目录
# ----------------------------------------------------------------------------
# 输入：图书目录页的扫描/拍照图片（支持多页，一次上传、按页 OCR）
# 输出：按模板渲染的文字版目录（Markdown / 纯文本大纲 / 表格）
#
# 工作流：ocr(逐页 VLM) → merge(跨页合并校对) → render(模板渲染，本地无 LLM)
# ============================================================================
id: book-toc
name: 图书目录识别
description: 上传扫描版图书目录页（可多页），自动 OCR、跨页合并校对，并按模板生成文字版目录
icon: book
order: 3

# ---- 输入声明（前端据此渲染上传控件，服务端按下列上限强校验）----
input:
  kind: image
  multiple: true            # 多页上传
  accept: image/png,image/jpeg,image/webp
  hint: 支持一次选择多张目录页（也可 Ctrl+V 粘贴）；建议按页码顺序选择
  max-files: 20             # 单次最多页数
  max-file-mb: 16           # 单张图片体积上限
  max-total-mb: 64          # 本次上传总体积上限

# ---- 输出声明（模板渲染，用法类似 Java FreeMarker）----
output:
  template: markdown        # 模板名 → templates/book-toc/markdown.tpl
  template-dir: ""          # 留空=使用内置模板；指定目录则用该目录下同名 .tpl 覆盖
  extension: .md            # 下载文件的扩展名

# ---- 工作流声明 ----
workflow:
  type: book-toc            # 编排类型（对应 internal/graph 内置图）
  entry: ocr
  max-retries: 0            # 目录识别无审读回退，失败即返回
  max-parallel: 3           # 逐页 OCR 并发度（1 = 串行；受 provider-max-requests 与端点算力共同约束）
  provider-max-requests: 2  # 单个 provider 的并发请求上限（本地推理建议 1–2，避免端点被打爆）
  retry-max: 2              # 单次调用失败重试上限（仅限流/5xx/网络错误才重试）
  retry-backoff-ms: 1500    # 重试退避基数（指数退避 + 抖动，上限 30s）
  pipeline:
    - ocr
    - merge
    - render

# ---- 各步骤独立配置（render 为本地模板渲染，不消耗 Token）----
# system-prompt / user-prompt 直接写在 yml，便于按需调整，无需重新编译。
# 留空则回退 internal/prompt 的内置默认提示词。
steps:
  # 逐页 OCR：单张目录页 → 条目 JSON
  ocr:
    provider: lmstudio-local
    model: qwen/qwen3-vl-8b
    temperature: 0.1
    max-tokens: 8192
    reasoning-enabled: false
    system-prompt: |
      你是一个专业的图书目录 OCR 引擎。请从用户提供的「图书目录页」扫描/拍照图片中提取目录条目。
      要求：
      1. 只输出一个 JSON 对象，形如 {"entries":[{"level":1,"number":"第1章","title":"标题","page":1}]}，不要输出解释或代码块标记。
      2. level 表示层级：1=篇/章，2=节，3=小节，依此类推，按编号与视觉缩进判断。
      3. number 保留原始编号文本（如 "第3章"、"2.1"、"Appendix A"）；无编号填空字符串。
      4. page 取该条目右侧的页码数字；缺失或无法判断填 0。
      5. 只提取图片中真实可见的条目，禁止编造、推测或补全；跨页延续的条目照常输出，合并由后续步骤处理。
      6. 保留标题原文的标点与大小写，不要翻译、改写或补全书名。
    user-prompt: |
      请提取这张图书目录页的所有目录条目，严格按系统指令输出 JSON。

  # 跨页合并：去重、修正层级、按页码排序
  merge:
    provider: lmstudio-local
    model: qwen/qwen3-vl-8b
    temperature: 0.1
    max-tokens: 8192
    reasoning-enabled: false
    system-prompt: |
      你是一个图书目录校对与合并引擎。输入是按页 OCR 得到的多段 JSON，请合并为一份完整目录。
      要求：
      1. 只输出一个 JSON 对象，形如 {"title":"书名","entries":[{"level":1,"number":"","title":"","page":0}]}。
      2. 跨页重复或延续的条目只保留一条；按 number + title 去重，页码取首次出现的值。
      3. 修正 OCR 造成的层级错误：子层级不得等于或小于父层级，保证层级体系连续合理。
      4. 按 page 升序排序，同页保持原出现顺序；page 为 0 的条目排在末尾。
      5. title（书名）尽量从内容推断；无法判断填空字符串。
      6. 不要新增输入中不存在的条目，不要输出解释或代码块标记。
