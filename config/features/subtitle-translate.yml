# ============================================================================
# 子功能：电影字幕翻译（SRT → 目标语言 SRT）
# ----------------------------------------------------------------------------
# 输入：UTF-8 编码的 .srt 字幕文件（单文件）+ 表单字段 target_lang（目标语言）
# 输出：保留序号与时间轴、仅替换对白文本的完整 SRT（final_report / translation）
#
# 工作流：parse(本地解析) → translate(分批 LLM 翻译) → render(本地重组，无 LLM)
# 由 config.yml 的 features[] 注册；模型与提示词全部在此声明，改配置无需重编译。
# ============================================================================
id: subtitle-translate
name: 电影字幕翻译
description: 上传 SRT 字幕文件，选择目标语言，自动批量翻译对白并保留序号与时间轴，生成可下载的 SRT
icon: translate
order: 4

# ---- 输入声明（前端据此渲染上传控件与目标语言下拉框，服务端强校验上限）----
input:
  kind: file
  multiple: false
  accept: .srt,text/plain
  hint: 上传 UTF-8 编码的 .srt 字幕；保留原序号与时间轴，只翻译对白。字幕较多时任务耗时较长
  max-files: 1
  max-file-mb: 4
  max-total-mb: 4
  # 可选：目标语言下拉框。前端把选中值以 target_lang 表单字段提交，
  # 服务端只接受 options 中的值（防止任意文本进入提示词），缺省取 default。
  target-language:
    label: 目标语言
    default: 简体中文
    options:
      - 简体中文
      - 繁體中文
      - English
      - 日本語
      - 한국어
      - Français
      - Deutsch
      - Español
      - Русский

# ---- 输出声明（SRT 由节点直接生成文本，不走模板）----
output:
  extension: .srt             # 前端「下载」按钮保存为 .srt

# ---- 工作流声明 ----
workflow:
  type: subtitle-translate    # 编排类型（对应 internal/graph 内置图）
  entry: parse
  max-retries: 0
  batch-size: 50              # 每批发给模型的字幕条数（前端可按次覆盖 batch_size 表单字段，0-200）
  max-parallel: 2             # 批次并发度（1 = 串行）
  provider-max-requests: 2    # 单个 provider 的并发请求上限
  retry-max: 2                # 单次调用失败重试上限（仅限流/5xx/网络错误）
  retry-backoff-ms: 1500      # 重试退避基数
  pipeline:
    - parse
    - translate
    - render

# ---- 步骤配置：仅 translate 调用 LLM；parse / render 为本地节点 ----
# system-prompt / user-prompt 直接写在 yml，代码内不硬编码任何提示词。
steps:
  translate:
    provider: lmstudio-local
    model: qwen/qwen3-4b-2507
    temperature: 0.2
    max-tokens: 8192
    reasoning-enabled: false
    system-prompt: |
      你是一位专业的影视字幕翻译引擎。用户会给出「目标语言」和一个 JSON 字符串数组，
      数组中每个元素是一条字幕的原文（元素内可能含 \n 表示多行字幕）。
      任务：把每条字幕翻译成目标语言。
      要求：
      1. 只输出一个 JSON 字符串数组，元素个数与顺序必须与输入完全一致；不要输出任何解释、注释或 Markdown 代码块标记。
      2. 每个元素对应一条字幕的译文；原文中的 \n 换行必须在译文相同位置保留。
      3. 保留字幕里的格式标记（如 <i>、<b>、{\an8}、HTML 实体）与标点风格，不要增删或改写标记。
      4. 电影对白应口语化、简洁，避免逐字直译；人名、地名、专有名词沿用惯例译法或保留原文。
      5. 不要合并、拆分、遗漏或新增条目；不要输出序号或时间码（输入中不含）。
      6. 某条原文为空字符串时，译文也输出空字符串。
    user-prompt: |
      请严格按系统指令把下列字幕翻译为目标语言，只输出 JSON 字符串数组。
