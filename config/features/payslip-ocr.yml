# ============================================================================
# 子功能：工资单 OCR（提取 + 合并）
# ----------------------------------------------------------------------------
# 由 config.yml 的 features[].config 引用；一个子功能 = 一条工作流 + 各步骤的
# provider/model/提示词/参数。步骤与工作流图表（internal/graph）一一对应。
#
# 工作流（简化后）：ocr(VLM) → END
#   ocr 节点把每张工资单截图里的「工资项目」数据识别出来并合并为一份 JSON，
#   不做任何解释、分析、评价或翻译。如需审读/翻译/分析报告，可在 steps 中追加
#   步骤并相应扩展 internal/graph 的图。
# ============================================================================
id: payslip-ocr
name: 工资单解析
description: 上传一张或多张工资单截图，自动识别每张的工资项目数据并合并为一份结构化结果，不做任何解释或分析。
icon: receipt
order: 2

# ---- 输入声明（支持多图）----
input:
  kind: image
  multiple: true
  accept: image/png,image/jpeg,image/webp
  hint: 可一次上传多张（工资单可能分多张截图，会合并为一份结果），也可 Ctrl+V 粘贴；本地模型提取通常需要 1–5 分钟

# ---- 工作流声明 ----
workflow:
  type: payslip-ocr          # 编排类型（对应 internal/graph 内置图）
  entry: ocr                 # 入口节点
  max-retries: 0             # 仅提取+合并，无校验回退
  pipeline:                  # 展示用节点顺序（同时用于概览页的流程链）
    - ocr

# ---- 各步骤独立配置：provider 引用 ai.yml 的 providers[].name ----
# system-prompt / user-prompt 直接写在 yml，便于按需调整，无需重新编译。
# 留空则回退 internal/prompt 的内置默认提示词。
steps:
  # 视觉 OCR：截图 → 合并后的结构化 JSON（需 VLM）
  ocr:
    provider: lmstudio-local
    model: qwen/qwen3-vl-8b
    temperature: 0.1
    max-tokens: 8192
    reasoning-enabled: false        # 视觉提取关闭思考，避免吃光 token 预算
    system-prompt: |
      你是一个工资单信息提取引擎。用户会提供一张或多张工资单截图。
      任务：识别每张截图中下列「工资项目」的数据，并将多张结果合并为一份 JSON。
      要求：
      1. 只输出一个 JSON 对象，不要输出任何解释、Markdown 代码块标记或多余文本。
      2. 只提取图片中真实可见的字段，绝对不要编造、推测或补全缺失字段。
      3. 严格按下表输出，每个字段使用给出的英文 key：
         - employee_id: ID（工号/员工编号）
         - should_attend_days: 应出勤天数
         - actual_attend_days: 实际出勤天数
         - base_salary: 基本工资
         - post_allowance: 岗位津贴
         - salary_grade: 薪级工资
         - full_attendance_bonus: 全勤奖励
         - comprehensive_salary: 综合工资
         - monthly_salary: 月度工资
         - overtime_subsidy: 加班补贴（含值班）
         - leave_days: 请假天数
         - leave_deduction: 请假扣款
         - meal_subsidy: 餐补
         - communication_subsidy: 通讯补贴
         - performance_subsidy: 绩效补贴
         - transport_subsidy: 交通补贴
         - high_temp_subsidy: 高温补贴
         - childrens_day_benefit: 六一子女福利
         - other_deduction: 扣款
         - subsidy_salary: 补贴工资
         - gross_salary: 应发工资
         - net_salary: 实发工资
         - withhold_union: 代扣工会费
         - withhold_social_housing: 代扣社保+公积金
         - withhold_income_tax: 代扣个税
         （若截图中出现「员工姓名」，可一并提取到 employee_name 字段）
         数值规则：金额提取为数字（保留原始数值，不换算、不附加货币符号，去掉千分位逗号，如「¥15,330.75」→ 15330.75）；天数提取为数字；文本原样提取。
      4. 工资单可能分多张截图，单张不一定包含所有项目：把各张截图里出现的字段合并到同一个 JSON；同一字段若出现在多张截图中，以内容更清晰、更完整的为准；不要为每张图分别输出。
      5. 任何字段在所有截图中均未出现则填 null。
      6. 严禁对数据做任何解释、分析、评价或翻译，只输出提取与合并后的 JSON。
    user-prompt: |
      请识别这些工资单截图中的上述工资项目数据并合并为一份结果，严格按系统指令只输出 JSON。
