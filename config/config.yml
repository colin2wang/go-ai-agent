# ============================================================================
# go-ai-agent 总配置（唯一入口）
# ----------------------------------------------------------------------------
# 运行：
#   harness                                   # 默认读取 config/config.yml
#   harness -config config/config.yml         # 显式指定
#
# 配置分层：
#   config.yml ──┬── ai.config ─────→ ai.yml                  AI provider 端点
#                └── features[].config ─→ features/*.yml       各子功能（工作流+步骤）
#
# 新增子功能：在下面 features 追加一项 + 新建对应 yml 即可，平台代码无需改动。
# 路径解析：绝对路径 > 当前工作目录 > 本文件所在目录；下面的引用写「相对本文件」，
# 因此从任意工作目录启动、-config 指向任意位置均可正确解析。
# ============================================================================

# ---- 应用元信息（前端标题栏 / 侧边栏展示）----
app:
  name: go-ai-agent
  title: AI 工作流平台

# ---- HTTP 服务 ----
server:
  addr: ":8000"                   # 首选监听端口；被占用时自动改用随机空闲端口（留空等价于 :8000）
  open-browser: true              # 启动后自动打开浏览器
  read-header-timeout-seconds: 10
  shutdown-timeout-seconds: 5
  # 对外调用令牌（仅保护 /api/*，前端页面不受影响）：为空 = 不鉴权（本机单用户默认）。
  # 第三方系统调用时带任一头：Authorization: Bearer <token> 或 X-API-Key: <token>
  api-tokens: []                  # 例：["harness-3f9c3e0f"]；生产建议同时配合环境变量注入
  auth-exclude-health: false      # true = /api/health 豁免鉴权（供存活探测用）

# ---- 存储：LLM 调用统计与任务/缓存（同一 SQLite 文件，纯 Go 无 CGO）----
storage:
  enabled: true
  db-path: ./database/go-ai-agent.db   # 目录不存在自动创建
  retention-days: 30                   # 流水/任务保留期，过期自动清理
  queue-capacity: 10000                # 异步写队列容量（满则丢弃，不阻塞调用链）
  persist-jobs: true                   # 工作流改为异步任务：上传立即返回 job_id，前端轮询进度（重启后仍可查）
  caps-ttl-hours: 24                   # 模型能力探测结果的有效期（重启免重测，过期重测）
  prune-interval-minutes: 60           # 过期任务/缓存/探测行的后台清理周期

# ---- LLM 结果缓存：相同 provider+模型+消息+参数 命中即不再请求端点 ----
# 对 OCR/提取类确定性任务收益最大；复用 storage 的 SQLite（需 storage.enabled）。
cache:
  enabled: true
  ttl-hours: 24                   # 缓存有效期（过期后下次真实重调）
  max-rows: 2000                  # 缓存行数上限（超出按写入时间淘汰最旧）
  keep-on-error: false            # 空回答是否也入缓存（默认 false：下次仍真实重试）

# ---- 日志级别：debug | info | warn | error ----
logging:
  level: info

# ---- AI provider 配置引用（相对本文件）----
ai:
  config: ai.yml

# ---- 子功能注册表（左侧菜单顺序 = 列表顺序；order 用于同组内排序）----
features:
  - id: chat
    enabled: true
    config: features/chat.yml

  - id: payslip-ocr
    enabled: true
    config: features/payslip-ocr.yml

  - id: book-toc
    enabled: true
    config: features/book-toc.yml
