definitions:
  api.FeatureChat:
    properties:
      default_provider:
        type: string
      max_history:
        type: integer
      max_image_mb:
        description: 单张图片体积上限 MB
        type: integer
      max_images:
        description: 单条消息最多附带图片数（仅视觉模型）
        type: integer
      stream_default:
        type: boolean
    type: object
  api.FeatureInfo:
    properties:
      async:
        description: true = 上传后立即返回 job_id，前端轮询获取进度与结果
        type: boolean
      chat:
        $ref: '#/definitions/api.FeatureChat'
      description:
        type: string
      icon:
        type: string
      id:
        type: string
      input:
        $ref: '#/definitions/api.FeatureInput'
      kind:
        description: workflow（默认，上传执行）| chat（对话）
        type: string
      name:
        type: string
      order:
        type: integer
      output:
        $ref: '#/definitions/api.FeatureOutput'
      pipeline:
        items:
          type: string
        type: array
      steps:
        items:
          type: string
        type: array
    type: object
  api.FeatureInput:
    properties:
      accept:
        type: string
      hint:
        type: string
      kind:
        type: string
      max_file_mb:
        type: integer
      max_files:
        type: integer
      max_total_mb:
        type: integer
      multiple:
        type: boolean
      target_language:
        $ref: '#/definitions/api.FeatureTargetLanguage'
    type: object
  api.FeatureOutput:
    properties:
      extension:
        type: string
      template:
        type: string
      template_dir:
        type: string
    type: object
  api.FeatureTargetLanguage:
    properties:
      default:
        type: string
      label:
        type: string
      options:
        items:
          type: string
        type: array
    type: object
  api.JobResult:
    properties:
      created_at:
        type: string
      detail:
        description: 进度描述（如“ocr 2/5”）
        type: string
      duration_ms:
        type: integer
      error:
        type: string
      feature_id:
        type: string
      final_report:
        type: string
      job_id:
        type: string
      ocr_text:
        type: string
      progress:
        description: 已完成步数（逐页 OCR 时为已完成页数）
        type: integer
      review_notes:
        items:
          type: string
        type: array
      status:
        description: pending | processing | running | done | failed
        type: string
      structured:
        additionalProperties: {}
        type: object
      total:
        type: integer
      translation:
        type: string
      updated_at:
        type: string
    type: object
  api.apiError:
    properties:
      error:
        example: error message
        type: string
    type: object
  api.chatImage:
    properties:
      data:
        type: string
      mime:
        type: string
      name:
        type: string
    type: object
  api.chatMessage:
    properties:
      content:
        type: string
      images:
        items:
          $ref: '#/definitions/api.chatImage'
        type: array
      role:
        type: string
    type: object
  api.chatSendRequest:
    properties:
      feature_id:
        type: string
      max_tokens:
        description: nil/0 = 步骤配置
        type: integer
      messages:
        items:
          $ref: '#/definitions/api.chatMessage'
        type: array
      model:
        type: string
      provider:
        type: string
      stream:
        description: nil = 跟随子功能/全局默认
        type: boolean
      temperature:
        description: nil = 步骤配置
        type: number
    type: object
info:
  contact: {}
paths:
  /api/chat/send:
    post:
      consumes:
      - application/json
      description: 将消息列表转发到所选 provider 的 chat/completions；默认以 SSE 逐块下发（事件 meta/delta/done/error），端点不支持流式时自动降级为一次性
        JSON（附 stream_fallback/note），stream=false 时直接一次性 JSON 返回。messages[].images
        可附带图片（base64，仅视觉模型与 user 消息）
      parameters:
      - description: 对话请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.chatSendRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流或完整响应
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 发送对话消息（SSE 流式）
      tags:
      - chat
  /api/features:
    get:
      description: 返回已启用的子功能（前端左侧菜单与流程链展示）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/api.FeatureInfo'
              type: array
            type: object
      summary: 子功能清单
      tags:
      - features
  /api/features/{id}/run:
    post:
      consumes:
      - multipart/form-data
      description: |-
        multipart 上传文件并按子功能 id 执行其工作流。单文件用 file 字段；多页场景用 files 字段（可多个，按上传顺序处理）。
        启用 storage.persist-jobs 后默认异步：立即返回 job_id（status=processing），前端轮询 GET /api/jobs/{id} 获取进度与结果；
        可用 query 参数 async=1 / async=0 强制单次请求的同步/异步行为。
      parameters:
      - description: 子功能 ID（如 payslip-ocr / book-toc）
        in: path
        name: id
        required: true
        type: string
      - description: async=1 强制异步 / async=0 强制同步
        in: query
        name: async
        type: string
      - description: 单文件输入（如工资单图片）
        in: formData
        name: file
        type: file
      - description: 多页输入（如多张目录页扫描件，可多个）
        in: formData
        name: files
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 执行子功能工作流
      tags:
      - features
  /api/health:
    get:
      description: 服务存活探测
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - system
  /api/jobs:
    get:
      description: |-
        返回异步任务（不含结果正文），支持过滤与分页：
        query: feature（子功能 id）、status（pending/running/done/failed）、n（每页条数，默认 50，上限 200）、offset（偏移量）
      parameters:
      - description: 按子功能 id 过滤
        in: query
        name: feature
        type: string
      - description: 按状态过滤
        in: query
        name: status
        type: string
      - description: 每页条数（默认 50，上限 200）
        in: query
        name: "n"
        type: integer
      - description: 分页偏移量
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'jobs: JobResult 数组；total: 过滤条件下的总条数'
          schema:
            additionalProperties: true
            type: object
      summary: 任务列表
      tags:
      - jobs
  /api/jobs/{id}:
    get:
      description: 按 jobID 查询一次执行的结果与进度（异步任务轮询此接口；启用 persist-jobs 后重启仍可查询历史任务）
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResult'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 查询任务结果
      tags:
      - jobs
  /api/jobs/{id}/events:
    get:
      description: '以 SSE 推送任务进度与终态：event: progress / done / failed，data 为 JobResult；任务已结束时收到终态后立即关闭'
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 任务进度流（SSE）
      tags:
      - jobs
  /api/overview:
    get:
      description: '最近 N 天（query: days，默认 14）调用统计聚合：总量/今日/耗时/成功率/趋势/模型用量/最近调用'
      parameters:
      - description: 统计天数（默认 14）
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 概览指标
      tags:
      - overview
  /api/payslip/review:
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data 上传工资单图片（字段名 file），执行 payslip-ocr 子功能工作流
      parameters:
      - description: 工资单图片（PNG/JPG）
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.JobResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 上传工资单并执行审读流水线
      tags:
      - payslip
  /api/providers/caps:
    get:
      description: '对指定 provider+model 真实调用接口检测视觉/推理/流式能力并缓存；模型不变时直接返回缓存结果（query:
        provider、model、force=1 跳过缓存强制重测）'
      parameters:
      - description: provider 名
        in: query
        name: provider
        required: true
        type: string
      - description: 模型名
        in: query
        name: model
        required: true
        type: string
      - description: force=1 强制重新探测
        in: query
        name: force
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: provider / model / vision / reasoning / stream / cached / probed_at
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 探测并缓存模型能力
      tags:
      - chat
  /api/providers/check:
    post:
      consumes:
      - application/json
      description: |-
        对 ai.yml 声明的 provider 做一次连通性探测（GET {base-url}/v1/models）。
        body: {"provider":"name"} 仅测指定端点，省略或为空则并发测试全部端点。
        由前端在概览页加载时调用一次、或用户手动点击「测试 / 全部测试」时调用，不做后台实时轮询。
      produces:
      - application/json
      responses:
        "200":
          description: 'results: llm.ProbeResult 数组（provider/status/http_status/latency_ms/detail/checked_at）'
          schema:
            additionalProperties: true
            type: object
      summary: 测试 AI 端点连通性
      tags:
      - providers
  /api/providers/models:
    get:
      description: '代理 OpenAI 兼容端点 GET {base-url}/v1/models，附视觉/推理能力粗判，供对话子功能选择模型（query:
        provider）'
      parameters:
      - description: provider 名（ai.yml 中声明）
        in: query
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: provider / base_url / models[]（chatModelInfo）
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 拉取 provider 的模型列表
      tags:
      - chat
  /api/providers/stream-check:
    get:
      description: '向 chat/completions 发一条最小流式请求（max_tokens=1），按 SSE 首帧判断端点是否支持流式（query:
        provider、model）'
      parameters:
      - description: provider 名
        in: query
        name: provider
        required: true
        type: string
      - description: 模型名
        in: query
        name: model
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: provider / model / stream_supported / detail / latency_ms
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.apiError'
      summary: 探测 provider 是否支持流式返回
      tags:
      - chat
swagger: "2.0"
